spring.application.name=modulo-montagem

# --- Banco de dados (PostgreSQL) ---
# Crie o banco antes: createdb modulo_montagem
spring.datasource.url=jdbc:postgresql://localhost:5432/modulo_montagem
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" gera/ajusta as tabelas automaticamente em dev.
# Trocar para "validate" quando tiver migrations (ex: Flyway) em producao.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor ---
server.port=8081

# --- CORS (liberado para o Angular local; ajustar em producao) ---
app.cors.allowed-origins=http://localhost:4201

# --- JWT ---
# Chave usada para assinar os tokens. TROQUE em producao por um valor longo e secreto
# (nunca versione a chave real -- use variavel de ambiente).
app.jwt.secret=troque-esta-chave-por-uma-bem-longa-e-secreta-em-producao-minimo-32-bytes
# 1 dia em milissegundos
app.jwt.expiration-ms=86400000

# --- Integracao com o ERP ---
# Chave que o ERP deve enviar no header X-Api-Key ao chamar o webhook de entrada.
app.erp.webhook-api-key=${ERP_WEBHOOK_API_KEY:troque-esta-chave}
# URL do ERP para onde este modulo envia atualizacoes de status da Ordem de Montagem.
app.erp.notificacao-url=${ERP_NOTIFICACAO_URL:http://localhost:8080/api/webhooks/montagem}

# --- Usuario ADMIN inicial (seed) ---
# So e criado automaticamente na primeira execucao, se o banco nao tiver
# nenhum usuario ainda. Sobrescreva via variaveis de ambiente antes de subir
# em qualquer ambiente compartilhado -- nunca deixe a senha padrao em producao.
app.admin-inicial.nome=${ADMIN_INICIAL_NOME:Administrador}
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:admin@modulomontagem.local}
app.admin-inicial.senha=${ADMIN_INICIAL_SENHA:troque-esta-senha}
