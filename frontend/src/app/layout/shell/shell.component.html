<div class="shell" [class.shell--colapsado]="colapsado()">

  <aside class="sidebar">
    <div class="sidebar__topo">
      <span class="sidebar__logo" *ngIf="!colapsado()">Módulo de Montagem</span>
      <button class="sidebar__toggle" (click)="toggleColapsado()" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <nav class="sidebar__nav">

      <!-- Dashboard: item unico, sem grupo -->
      <a
        *ngIf="podeVerRelatorios"
        routerLink="/dashboard"
        routerLinkActive="sidebar__link--ativo"
        class="sidebar__link sidebar__link--topo"
      >
        <svg class="sidebar__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M7 15l4-4 3 3 5-6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span *ngIf="!colapsado()">Dashboard</span>
      </a>

      <!-- Grupos colapsaveis -->
      <div class="sidebar__grupo" *ngFor="let grupo of grupos">
        <button class="sidebar__grupo-cabecalho" (click)="toggleGrupo(chaveGrupo(grupo.label))">
          <svg class="sidebar__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
          </svg>
          <span *ngIf="!colapsado()" class="sidebar__grupo-label">{{ grupo.label }}</span>
          <svg
            *ngIf="!colapsado()"
            class="sidebar__chevron"
            [class.sidebar__chevron--aberto]="grupoAberto(chaveGrupo(grupo.label))"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          >
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="sidebar__grupo-itens" *ngIf="grupoAberto(chaveGrupo(grupo.label)) && !colapsado()">
          <a
            *ngFor="let item of grupo.itens"
            [routerLink]="item.path"
            routerLinkActive="sidebar__link--ativo"
            class="sidebar__link sidebar__link--filho"
          >
            {{ item.label }}
          </a>
        </div>
      </div>

      <!-- Administracao: so ADMIN -->
      <div class="sidebar__grupo" *ngIf="isAdmin">
        <button class="sidebar__grupo-cabecalho" (click)="toggleGrupo('administracao')">
          <svg class="sidebar__icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21v-2a6 6 0 0112 0v2" stroke-linecap="round" />
          </svg>
          <span *ngIf="!colapsado()" class="sidebar__grupo-label">Administração</span>
          <svg
            *ngIf="!colapsado()"
            class="sidebar__chevron"
            [class.sidebar__chevron--aberto]="grupoAberto('administracao')"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          >
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="sidebar__grupo-itens" *ngIf="grupoAberto('administracao') && !colapsado()">
          <a routerLink="/usuarios" routerLinkActive="sidebar__link--ativo" class="sidebar__link sidebar__link--filho">
            Usuários
          </a>
        </div>
      </div>
    </nav>

    <div class="sidebar__rodape">
      <div class="sidebar__usuario" *ngIf="!colapsado()">
        <strong>{{ nomeUsuario }}</strong>
        <span>{{ perfilUsuario }}</span>
      </div>
      <button class="sidebar__sair" (click)="sair()" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span *ngIf="!colapsado()">Sair</span>
      </button>
    </div>
  </aside>

  <main class="conteudo">
    <router-outlet></router-outlet>
  </main>
</div>
