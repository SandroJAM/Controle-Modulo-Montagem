<nav class="breadcrumb">
  <a routerLink="/ordens-montagem">Página Inicial</a> / Usuários
</nav>

<div class="toolbar">
  <div class="toolbar-grupo">
    <button class="btn-acao btn-acao--inserir" (click)="abrirInserir()">+ Inserir</button>
    <button class="btn-acao btn-acao--editar" (click)="abrirEditar()" [disabled]="selecionadoId() === null">
      ✎ Editar
    </button>
    <button class="btn-acao btn-acao--excluir" disabled title="Exclusão ainda não disponível nesta versão">
      🗑 Excluir
    </button>
  </div>
</div>

<form *ngIf="mostrarFormulario()" [formGroup]="form" (ngSubmit)="submeter()" class="filtros" style="align-items: flex-start; margin-bottom: 1.5rem;">
  <label>
    Nome
    <input type="text" formControlName="nome" />
  </label>
  <label>
    E-mail
    <input type="email" formControlName="email" />
  </label>
  <label>
    {{ idEmEdicao ? 'Nova senha (opcional)' : 'Senha' }}
    <input type="password" formControlName="senha" />
  </label>
  <label>
    Perfil
    <select formControlName="perfil">
      <option *ngFor="let p of perfis" [value]="p">{{ p }}</option>
    </select>
  </label>
  <button type="submit" class="btn-acao btn-acao--inserir" [disabled]="form.invalid">
    {{ idEmEdicao ? 'Salvar' : 'Adicionar' }}
  </button>
  <button type="button" class="btn-acao btn-acao--secundario" (click)="cancelar()">Cancelar</button>
</form>

<div class="pagina-seletor">
  <select [(ngModel)]="itensPorPagina" [ngModelOptions]="{ standalone: true }">
    <option [ngValue]="20">20</option>
    <option [ngValue]="50">50</option>
    <option [ngValue]="100">100</option>
  </select>
  resultados por página
</div>

<div class="tabela-wrapper">
  <table>
    <thead>
      <tr>
        <th class="col-checkbox"></th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Perfil</th>
        <th>Ativo</th>
      </tr>
      <tr class="linha-filtro">
        <th></th>
        <th><input type="text" [(ngModel)]="filtroNome" [ngModelOptions]="{ standalone: true }" /></th>
        <th><input type="text" [(ngModel)]="filtroEmail" [ngModelOptions]="{ standalone: true }" /></th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of listaFiltrada | slice:0:itensPorPagina">
        <td class="col-checkbox">
          <input type="radio" name="selecao" [checked]="selecionadoId() === u.id" (click)="selecionar(u.id!)" />
        </td>
        <td>{{ u.nome }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.perfil }}</td>
        <td>{{ u.ativo ? 'Sim' : 'Não' }}</td>
      </tr>
      <tr *ngIf="listaFiltrada.length === 0">
        <td colspan="5">Nenhum usuário encontrado.</td>
      </tr>
    </tbody>
  </table>
</div>
