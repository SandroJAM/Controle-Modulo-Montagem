<div class="login-page">
  <div class="login-card">
    <p class="login-card__subtitle">Digite suas credenciais para entrar no sistema</p>

    <form [formGroup]="form" (ngSubmit)="submeter()">
      <input
        type="email"
        formControlName="email"
        placeholder="E-mail"
        class="login-card__input"
        autocomplete="username"
      />

      <input
        type="password"
        formControlName="senha"
        placeholder="Senha"
        class="login-card__input"
        autocomplete="current-password"
      />

      <label class="login-card__lembrar">
        <input type="checkbox" formControlName="lembrarEmail" />
        Lembrar e-mail?
      </label>

      <p *ngIf="erro" class="login-card__erro">{{ erro }}</p>

      <div class="login-card__acoes">
        <button type="submit" class="login-card__botao" [disabled]="form.invalid || carregando">
          {{ carregando ? 'Entrando...' : 'Entrar' }}
        </button>
      </div>

      <p class="login-card__link-esqueci">
        Esqueceu sua senha? <a href="javascript:void(0)">Redefinir</a>
      </p>
    </form>
  </div>
</div>
